<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cadastro - Sebos Londrina</title>

    <link
        rel="stylesheet"
        href="../static/style.css"
    >

</head>

<body>

    <header class="header">

        <div class="logo">

            <span>📚</span>

            <h1>
                Sebos Londrina
            </h1>

        </div>

        <nav class="navbar">

            <a href="index.html">
                Início
            </a>

            <a href="resultado.html">
                Sebos
            </a>

        </nav>

    </header>


    <main class="auth-page">

        <section class="auth-card">

            <div class="auth-header">

                <div class="auth-icon">
                    📚
                </div>

                <span class="hero-tag">
                    NOVO USUÁRIO
                </span>

                <h2>
                    Criar sua conta
                </h2>

                <p>
                    Faça parte da comunidade
                    Sebos Londrina.
                </p>

            </div>


            <form class="auth-form" onsubmit="validarCadastro(event)">

                <div class="form-group">

                    <label for="nome">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="seuemail@exemplo.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Crie uma senha"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmar_senha">
                        Confirmar senha
                    </label>

                    <input
                        type="password"
                        id="confirmar_senha"
                        name="confirmar_senha"
                        placeholder="Digite a senha novamente"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button"
                >

                    Criar minha conta

                </button>

            </form>

            <script>
                function validarCadastro(event) {
                    event.preventDefault();

                    let nome = document.getElementById('nome').value;
                    let email = document.getElementById('email').value;
                    let senha = document.getElementById('senha').value;
                    let confirmarSenha = document.getElementById('confirmar_senha').value;

                    if (nome && email && senha && confirmarSenha) {
                        if (senha === confirmarSenha) {
                            window.location.href = 'login.html';
                        } else {
                            alert('As senhas não coincidem!');
                        }
                    } else {
                        alert('Preencha todos os campos!');
                    }
                }
            </script>

            <div class="auth-footer">

                <p>
                    Já possui uma conta?
                </p>

                <a href="login.html">
                    Fazer login
                </a>

            </div>


            <a
                href="index.html"
                class="back-link"
            >

                ← Voltar para o início

            </a>

        </section>

    </main>


    <footer>

        <div class="copyright">

            © 2026 Sebos Londrina —
            Projeto acadêmico

        </div>

    </footer>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Avaliar Sebo - Sebos Londrina</title>

    <link
        rel="stylesheet"
        href="../static/style.css"
    >

</head>


<body>


    <!-- =====================================
         CABEÇALHO
    ====================================== -->

    <header class="header">

        <div class="logo">

            <span>📚</span>

            <h1>
                Sebos Londrina
            </h1>

        </div>


        <nav class="navbar">

            <a href="index.html">
                Início
            </a>

            <a href="resultado.html">
                Sebos
            </a>

            <a href="perfil.html">
                Meu perfil
            </a>

        </nav>

    </header>



    <!-- =====================================
         AVALIAÇÃO
    ====================================== -->

    <main class="evaluation-page">


        <section class="evaluation-card">


            <div class="evaluation-header">

                <div class="auth-icon">
                    ⭐
                </div>


                <span class="hero-tag">
                    COMUNIDADE
                </span>


                <h2>
                    Avaliar um sebo
                </h2>


                <p>
                    Compartilhe sua experiência
                    e ajude outros leitores.
                </p>

            </div>



            <!-- =====================================
                 FORMULÁRIO
            ====================================== -->

            <form class="evaluation-form">


                <!-- SEBO -->

                <div class="form-group">

                    <label for="sebo">

                        Escolha o sebo

                    </label>


                    <select
                        id="sebo"
                        name="sebo"
                        required
                    >

                        <option value="">

                            Selecione um sebo

                        </option>


                        <option value="1">

                            Sebo Exemplo

                        </option>


                        <option value="2">

                            Livraria Exemplo

                        </option>


                        <option value="3">

                            Sebo do Leitor

                        </option>

                    </select>

                </div>



                <!-- NOTA -->

                <div class="form-group">

                    <label for="nota">

                        Sua nota

                    </label>


                    <select
                        id="nota"
                        name="nota"
                        required
                    >

                        <option value="">

                            Escolha uma nota

                        </option>


                        <option value="5">

                            ⭐⭐⭐⭐⭐ — Excelente

                        </option>


                        <option value="4">

                            ⭐⭐⭐⭐ — Muito bom

                        </option>


                        <option value="3">

                            ⭐⭐⭐ — Bom

                        </option>


                        <option value="2">

                            ⭐⭐ — Regular

                        </option>


                        <option value="1">

                            ⭐ — Ruim

                        </option>

                    </select>

                </div>



                <!-- COMENTÁRIO -->

                <div class="form-group">

                    <label for="comentario">

                        Seu comentário

                    </label>


                    <textarea
                        id="comentario"
                        name="comentario"
                        rows="6"
                        placeholder="Conte como foi sua experiência..."
                        required
                    ></textarea>

                </div>



                <!-- BOTÃO -->

                <button
                    type="submit"
                    class="auth-button"
                >

                    Enviar avaliação

                </button>


            </form>



            <!-- VOLTAR -->

            <div class="auth-footer">

                <a href="perfil.html">

                    ← Voltar para meu perfil

                </a>

            </div>


        </section>


    </main>



    <!-- =====================================
         RODAPÉ
    ====================================== -->

    <footer>

        <div class="copyright">

            © 2026 Sebos Londrina —
            Projeto acadêmico

        </div>

    </footer>


</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Sebos Londrina</title>

    <link
        rel="stylesheet"
        href="../static/style.css"
    >

</head>

<body>

    <header class="header">

        <div class="logo">

            <span>📚</span>

            <h1>
                Sebos Londrina
            </h1>

        </div>

        <nav class="navbar">

            <a href="index.html">
                Início
            </a>

            <a href="resultado.html">
                Sebos
            </a>

        </nav>

    </header>


    <main class="auth-page">

        <section class="auth-card">

            <div class="auth-header">

                <div class="auth-icon">
                    📚
                </div>

                <span class="hero-tag">
                    ÁREA DO USUÁRIO
                </span>

                <h2>
                    Bem-vindo de volta
                </h2>

                <p>
                    Entre na sua conta para
                    continuar no Sebos Londrina.
                </p>

            </div>


            <form class="auth-form">

                <div class="form-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="seuemail@exemplo.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        required
                    >

                </div>


                <div class="form-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            name="lembrar"
                        >

                        Lembrar de mim

                    </label>

                    <a href="#">
                        Esqueci minha senha
                    </a>

                </div>


                <button
                    type="submit"
                    class="auth-button"
                   
                >

                    Criar minha conta

                </button>

               


            </form>

            <script>

                function validarCadastro(event) {
    event.preventDefault();

    let email = document.getElementById('email').value;
    let senha = document.getElementById('senha').value;

    // Se algum dos campos estiver vazio, avisa o usuário
    if (email === '' && senha === '') {
        alert('Preencha todos os campos!');
    } else {
        // Se estiverem preenchidos, redireciona
        window.location.href = 'index.html';
    }
}

            </script>
          
            <div class="auth-footer">

                <p>
                    Ainda não possui uma conta?
                </p>

                <a href="cadastro.html">
                    Criar uma conta
                </a>

            </div>


            <a
                href="index.html"
                class="back-link"
            >

                ← Voltar para o início

            </a>

        </section>

    </main>


    <footer>

        <div class="copyright">

            © 2026 Sebos Londrina —
            Projeto acadêmico

        </div>

    </footer>

    <script>
        function validarCadastro(event) {
            // Impede que a página recarregue ao enviar o formulário
            event.preventDefault();

            // Pega os valores digitados nos inputs
            let nome = document.getElementById('nome').value;
            let email = document.getElementById('email').value;
            let senha = document.getElementById('senha').value;
            let confirmarSenha = document.getElementById('confirmar_senha').value;

            // Exemplo de verificação simples se estão preenchidos e se as senhas coincidem
            if (nome && email && senha && confirmarSenha) {
                if (senha === confirmarSenha) {
                    // Se tudo estiver correto, redireciona para o login
                    window.location.href = 'login.html';
                } else {
                    alert('As senhas não coincidem!');
                }
            } else {
                alert('Preencha todos os campos!');
            }
        }
    </script>

</body>

</html>

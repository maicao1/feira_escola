<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Sebos Londrina</title>

    <link
        rel="stylesheet"
        href="../static/style.css"
    >

</head>

<body>

    <header class="header">

        <div class="logo">

            <span>📚</span>

            <h1>
                Sebos Londrina
            </h1>

        </div>

        <nav class="navbar">

            <a href="index.html">
                Início
            </a>

            <a href="resultado.html">
                Sebos
            </a>

        </nav>

    </header>


    <main class="auth-page">

        <section class="auth-card">

            <div class="auth-header">

                <div class="auth-icon">
                    📚
                </div>

                <span class="hero-tag">
                    ÁREA DO USUÁRIO
                </span>

                <h2>
                    Bem-vindo de volta
                </h2>

                <p>
                    Entre na sua conta para
                    continuar no Sebos Londrina.
                </p>

            </div>


            <form class="auth-form" onsubmit="validarLogin(event)">

                <div class="form-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="seuemail@exemplo.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        required
                    >

                </div>


                <div class="form-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            name="lembrar"
                        >

                        Lembrar de mim

                    </label>

                    <a href="#">
                        Esqueci minha senha
                    </a>

                </div>


                <button
                    type="submit"
                    class="auth-button"
                   
                >

                    Entrar

                </button>

               


            </form>

            <script>

function validarLogin(event) {
    event.preventDefault();

    let email = document.getElementById('email').value.trim();
    let senha = document.getElementById('senha').value.trim();

    // Verifica se o e-mail OU a senha estão vazios
    if (email === '' || senha === '') {
        alert('Por favor, preencha todos os campos!');
    } else {
        // Se ambos estiverem preenchidos, redireciona
        window.location.href = '../templates/index.html';
    }
}

            </script>
          
            <div class="auth-footer">

                <p>
                    Ainda não possui uma conta?
                </p>

                <a href="cadastro.html">
                    Criar uma conta
                </a>

            </div>


            <a
                href="index.html"
                class="back-link"
            >

                ← Voltar para o início

            </a>

        </section>

    </main>


    <footer>

        <div class="copyright">

            © 2026 Sebos Londrina —
            Projeto acadêmico

        </div>

    </footer>

    

</body>

</html>
